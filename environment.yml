name: cp-headless
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9.19
  - cellprofiler=4.2.8.1
  - cellprofiler-core=4.2.8.1
  - numpy=1.24.4
  - scipy=1.9.0
  - scikit-image=0.18.3
  - tifffile=2022.4.8
  - pandas=2.2.3          
  - pyarrow=16.1.0 
  - sentry-sdk=0.18.0
  - setuptools<81
  - pytest=7.4.4
  - pip=25.2
  # Cellpose-SAM for RunCellpose (plugins/runcellpose.py). The CUDA build of torch also runs on
  # computers without a GPU. Nothing here changes the conda packages above (numpy stays 1.24.4).
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - cellpose==4.0.6
      - segment_anything==1.0
      - opencv-python-headless==4.10.0.84
      - fastremap==1.21.0
      - fill-voids==2.1.2
      - roifile==2024.9.15
      - natsort==8.4.0
      - tqdm==4.70.1
