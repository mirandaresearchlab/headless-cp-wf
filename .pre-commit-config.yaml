# Checks that run before each commit. Install once with: uvx pre-commit install
# Run all of them by hand with: uvx pre-commit run --all-files
# Each check runs only when a file that matches its "files" pattern changed.
exclude: ^(\.claude|\.agent)/

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:

      # The full test suite in the cp-headless conda environment (CellProfiler, Java, Python 3.9).
      # GitHub only runs the tests that need no CellProfiler, so this is where the plugin tests run.
      - id: pytest-cellprofiler
        name: full test suite (cp-headless environment)
        entry: bash scripts/test-cellprofiler.sh
        language: system
        pass_filenames: false
        files: ^(bin/.*\.py|plugins/.*\.py|tests/.*\.py|cp-configs/.*|environment\.yml|scripts/test-cellprofiler\.sh)$

      # The documentation site: --strict stops on broken links and missing pages (see docs/about/contributing.md).
      # uv installs the pinned docs tools from requirements-docs.txt the first time.
      - id: docs-build
        name: documentation site (mkdocs build --strict)
        entry: uv run --no-project --with-requirements requirements-docs.txt mkdocs build --strict --quiet
        language: system
        pass_filenames: false
        files: ^(docs/.*|mkdocs\.yml|requirements-docs\.txt|README\.md|nextflow\.config|nf-config/.*|cp-configs/.*|bin/.*\.py)$
