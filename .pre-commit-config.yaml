minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pytest
        name: python tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        files: ^(bin/.*\.py|tests/.*\.py|scripts/.*|pyproject\.toml|uv\.lock|Dockerfile|\.dockerignore|\.github/workflows/.*\.ya?ml)$

      - id: pytest-py38
        name: helper tests on Python 3.8 (CellProfiler container)
        entry: bash scripts/test-helpers-py38.sh
        language: system
        pass_filenames: false
        files: ^(bin/.*\.py|tests/.*\.py|scripts/test-helpers-py38\.sh)$

      - id: nextflow-stub
        name: Nextflow stub test
        entry: bash scripts/test-nextflow.sh
        language: system
        pass_filenames: false
        files: ^(main\.nf|nextflow\.config|conf/.*\.config|bin/.*\.py|tests/test\.cppipe)$

      - id: workflow-tests
        name: Nextflow workflow tests (stub runs)
        entry: uv run pytest -q -m workflow
        language: system
        pass_filenames: false
        files: ^(main\.nf|nextflow\.config|conf/.*\.config|bin/.*\.py|tests/.*)$
