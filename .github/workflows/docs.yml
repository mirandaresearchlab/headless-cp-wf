# Documentation site: build it with MkDocs and publish it on GitHub Pages.
#   pull request:          build only. --strict fails on broken links and missing pages.
#   push to main (or run): build, then publish at https://mirandaresearchlab.github.io/headless-cp-wf/
# Once, an owner must set: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# See docs/about/contributing.md.
name: docs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running publication, so that the site is never half updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docs.txt

      # docs/.hooks/prebuild.py makes the parameter and command-line reference pages during the build.
      - name: Build (strict - fails on broken links / missing pages)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publish only from the default branch. Pull requests and other branches only build.
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
