# Automatic checks on GitHub. All jobs run on each push to each branch. See docs/about/contributing.md.
#   pre-commit:         all checks of .pre-commit-config.yaml, and a bot commit with automatic corrections
#   workflow:           the stub-run workflow tests (pytest -m workflow) on Ubuntu and on macOS
#   cellprofiler:       real CellProfiler in Docker on the Ubuntu runner (-profile test,docker)
#   workstation-local:  real CellProfiler without Docker, as root in an Ubuntu 24.04 container (-profile test,local)
#   workstation-docker: Docker inside a privileged Ubuntu 24.04 container, like a lab workstation (-profile test,docker)
# GitHub cannot run Berzelius. Its scripts are tested with fake sbatch and apptainer programs (pre-commit job).
name: CI

on:
  push:
    branches:
      - "**"

# The pre-commit job needs write permission for its correction commit.
permissions:
  contents: write

# A new push to the same branch cancels the older run.
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run hooks and apply corrections
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The actions are pinned by commit hash. The comment after each hash is the version.
    steps:
      - name: Check out pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165 # v2.1.4
        with:
          version: "26.04.6"

      # Run the checks up to 3 times. A check that corrects files fails once, and then passes on the
      # corrected files. These checks correct files: ruff lint (--fix), ruff format and comment spacing
      # (--fix). If the checks pass after corrections, commit and push the corrections.
      # If a check fails without a correction, stop with its error.
      - name: Run pre-commit and apply available corrections
        env:
          BRANCH_NAME: ${{ github.ref_name }}

          # The workflow tests start Nextflow many times. The workflow job runs them, on Ubuntu and macOS.
          # The short stub test still runs here.
          SKIP: workflow-tests
        run: |
          status=1
          for attempt in 1 2 3; do
            echo "Pre-commit attempt ${attempt}/3"
            set +e
            uv run pre-commit run --all-files --show-diff-on-failure
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              break
            fi

            if git diff --quiet; then
              echo "::error::A pre-commit check failed, and no check could correct it automatically."
              echo "Read the failed check above, fix it by hand, and push again."
              echo "To see the same result on your computer, run: uv run pre-commit run --all-files"
              exit "$status"
            fi
          done

          if [[ "$status" -ne 0 ]]; then
            echo "Pre-commit still fails after three automatic-correction attempts."
            exit "$status"
          fi

          if git diff --quiet; then
            echo "Pre-commit passed without corrections."
            exit 0
          fi

          # Commit only changes to tracked files ("git add --update"), never new files.
          # "[skip ci]" stops the bot commit from starting this workflow again.
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "style: apply pre-commit corrections [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"

  # The GitHub runners are Linux on amd64 and have Docker, so the CellProfiler image runs without emulation.
  cellprofiler:
    name: Real CellProfiler tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@6c2e22b4d901f0c42ca66c5069f8026df026d165 # v2.1.4
        with:
          version: "26.04.6"

      - name: Run CellProfiler module, patch and end-to-end tests
        run: uv run pytest -m cellprofiler -v

  # The stub-run tests start Nextflow many times, so pre-commit skips them. Here they run on both systems.
  # macOS is for development only: it checks the workflow logic, not CellProfiler.
  workflow:
    name: Workflow tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java 21 for Nextflow
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies (with Nextflow)
        run: uv sync --locked --all-groups

      - name: Run the fast tests and the stub-run workflow tests
        run: |
          uv run pytest -v
          uv run pytest -v -m workflow

  # A lab workstation without Docker: root in an Ubuntu container. The steps are the ones of
  # docs/how-to/run-without-docker.md: micromamba, one environment for Nextflow, one for CellProfiler.
  workstation-local:
    name: Workstation without Docker (Ubuntu 24.04, -profile local)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ubuntu:24.04

    steps:
      - name: Install the system tools of the guide
        run: |
          apt-get update
          apt-get install -y git procps curl ca-certificates bzip2 python3

      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without a terminal, the installer asks no questions and takes the defaults of the guide.
      # VERSION pins micromamba, so that a new release cannot change this job.
      - name: Install micromamba and Nextflow (Installation, steps 3 to 5)
        shell: bash
        run: |
          VERSION=2.9.0-0 bash <(curl -L -s https://micro.mamba.pm/install.sh) < /dev/null
          export MAMBA_ROOT_PREFIX="$HOME/micromamba" PATH="$HOME/.local/bin:$PATH"
          micromamba create -y -n nextflow -c conda-forge -c bioconda nextflow=26.04.6 openjdk=21
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$MAMBA_ROOT_PREFIX/envs/nextflow/bin" >> "$GITHUB_PATH"
          echo "MAMBA_ROOT_PREFIX=$MAMBA_ROOT_PREFIX" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$MAMBA_ROOT_PREFIX/envs/nextflow/lib/jvm" >> "$GITHUB_ENV"

      # Installation, step 6: the dry run, before CellProfiler is installed.
      - name: Dry run without CellProfiler
        run: nextflow run . -profile test,local -stub-run

      - name: Install CellProfiler (Run without Docker, step 1)
        shell: bash
        run: |
          micromamba create -y -n cellprofiler -c conda-forge -c bioconda cellprofiler=4.2.8 openjdk=11
          echo "$MAMBA_ROOT_PREFIX/envs/cellprofiler/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"

      - name: Run real CellProfiler without a container
        shell: bash
        run: |
          nextflow -version
          cellprofiler --version | tail -1
          uv sync --locked --all-groups
          uv run pytest -v -m local_cellprofiler

  # A lab workstation with Docker inside it. The workstation container must be privileged, and
  # /var/lib/docker must be a volume: Docker cannot store images on the overlay file system of a container.
  # See docs/how-to/run-with-docker.md.
  workstation-docker:
    name: Workstation with Docker inside (privileged Ubuntu 24.04, -profile docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ubuntu:24.04
      options: --privileged --volume /var/lib/docker

    steps:
      - name: Install the system tools and Docker of the guide
        run: |
          apt-get update
          apt-get install -y git procps curl ca-certificates bzip2 docker.io

      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub mounts the Docker socket of the runner into every job container. A lab workstation of setup A
      # has no such socket. Unmount it, so that the docker command uses the service inside this container.
      # (The runner's service cannot see the folders of this container: each job failed with exit status 1.)
      - name: Disconnect the Docker socket of the runner
        run: umount /var/run/docker.sock

      # The script of the guide: it checks the container, applies the cgroup v2 fix and starts the service.
      - name: Start the Docker service inside the container
        run: bash scripts/start-docker-in-container.sh

      - name: Install micromamba and the Nextflow environment
        shell: bash
        run: |
          VERSION=2.9.0-0 bash <(curl -L -s https://micro.mamba.pm/install.sh) < /dev/null
          export MAMBA_ROOT_PREFIX="$HOME/micromamba" PATH="$HOME/.local/bin:$PATH"
          micromamba create -y -n nextflow -c conda-forge -c bioconda nextflow=26.04.6 openjdk=21
          echo "$MAMBA_ROOT_PREFIX/envs/nextflow/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$MAMBA_ROOT_PREFIX/envs/nextflow/lib/jvm" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"

      - name: Run real CellProfiler in Docker inside the container
        shell: bash
        run: |
          uv sync --locked --all-groups
          uv run pytest -v -m cellprofiler
