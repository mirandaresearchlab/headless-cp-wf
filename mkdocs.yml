site_name: Headless CellProfiler
site_url: https://mirandaresearchlab.github.io/headless-cp-wf/
repo_url: https://github.com/mirandaresearchlab/headless-cp-wf

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/.hooks/prebuild.py

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - "Installation": getting-started/installation.md
      - "Tutorial": tutorials/first-run.md
  - Usage:
      - "Usage": usage.md
      - "Output": output.md
  - How-to guides:
      - "How-to guides": how-to/index.md
      - "Run on HPC": how-to/run-on-hpc.md
      - "Berzelius FAQ": how-to/berzelius-faq.md
      - "Change a pipeline": how-to/modify-pipeline.md
      - "Troubleshooting": how-to/troubleshooting.md
  - Reference:
      - "Resources": reference/resources.md
      - "Parameters": reference/parameters.md
      - "Command-line reference": reference/cli.md
      - "File formats": reference/file-formats.md
      - "CellProfiler pipelines": reference/pipelines.md
      - "Glossary": reference/glossary.md
  - Explanation:
      - "How the workflow works": explanation/workflow.md
      - "Segmentation choices": explanation/segmentation.md
      - "Design": explanation/design.md
  - About:
      - "Changelog": about/changelog.md
      - "Citation": about/citation.md
      - "Contributing": about/contributing.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
