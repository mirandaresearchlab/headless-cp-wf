# Settings of the Python development tools. The workflow itself is not a Python package: this file
# only describes the tools for tests and checks. See docs/about/contributing.md.

[project]
name = "cp-headless"
version = "1.0.0"
description = "Development tooling for the cp-headless Nextflow workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nextflow>=26.4.6",
]

# Tools for development only. `uv sync --all-groups` installs them into .venv.
[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]

# Workflow tests start Nextflow and take about a minute: run them with `pytest -m workflow`.
addopts = "-ra -m 'not workflow and not cellprofiler and not rootless'"
testpaths = ["tests"]
markers = [
    "workflow: runs main.nf with -stub-run (needs Nextflow and Java)",
    "cellprofiler: runs real CellProfiler in Docker (needs Docker)",
    "rootless: runs real CellProfiler with rootless Docker (needs a rootless Docker daemon on Linux)",
]

# Ruff: code style and lint rules for bin/, tests/ and scripts/.
[tool.ruff]

# The skill folders hold other people's code. force-exclude also applies when pre-commit names the files.
extend-exclude = [".claude", ".agent"]
force-exclude = true
line-length = 110
target-version = "py311"

[tool.ruff.per-file-target-version]

# bin/ runs inside the CellProfiler 4.2.8 container (Python 3.8).
"bin/*.py" = "py38"

# D = docstring rules. Every module and function needs a docstring in numpy style.
# D202 is off: the comment rule of this project puts an empty line above a comment, also directly
# after a docstring (see docs/about/contributing.md).
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D202"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# merge_features.py chooses between open() and gzip.open() with a lambda, which SIM115 would flag.
[tool.ruff.lint.per-file-ignores]
"bin/merge_features.py" = ["SIM115"]
