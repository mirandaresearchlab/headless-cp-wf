[project]
name = "cp-headless"
version = "1.0.0"
description = "Development tooling for the cp-headless Nextflow workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nextflow>=26.4.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Workflow tests start Nextflow and take about a minute: run them with `pytest -m workflow`.
addopts = "-ra -m 'not workflow and not cellprofiler'"
testpaths = ["tests"]
markers = [
    "workflow: runs main.nf with -stub-run (needs Nextflow and Java)",
    "cellprofiler: runs real CellProfiler in Docker (needs Docker)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.per-file-target-version]
# bin/ runs inside the CellProfiler 4.2.8 container (Python 3.8).
"bin/*.py" = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bin/merge_features.py" = ["SIM115"]
