[project]
name = "cp-headless"
version = "1.0.0"
description = "Development tooling for the cp-headless Nextflow workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nextflow>=26.4.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bin/merge_features.py" = ["SIM115"]
